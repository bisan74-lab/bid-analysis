name = "bid-analysis"
compatibility_date = "2026-07-01"
# 공용 lib(analysis/g2b/kakao)가 top-level에서 require('fs')/require('path')를 하므로 unenv 폴리필 필요.
# (Worker 실행 경로에선 fs 함수를 호출하지 않음 — CSV는 번들 Text 임포트, 토큰/데이터는 KV 사용.)
compatibility_flags = ["nodejs_compat"]

# webapp/build-static.js가 빌드 시점 정적 JSON(폴백)을 webapp/dist에 만들고, webapp/worker/index.js가
# 그 정적 자산(ASSETS)을 서빙하면서 로그인 인증 + KV 기반 진행중입찰/분석 데이터 + cron(나라장터 자동
# 갱신·카카오 알림)을 처리합니다.
main = "webapp/worker/index.js"

[assets]
directory = "./webapp/dist"
binding = "ASSETS"
# 기본값(false)이면 정적 자산과 경로가 겹치는 요청(특히 "/"와 "/api/*.json")은 Worker를 거치지 않고
# 바로 서빙돼서 로그인 체크(fetch 핸들러)가 통째로 우회된다 — 반드시 true로 설정해야 인증이 걸린다.
run_worker_first = true

[[kv_namespaces]]
binding = "ADMIN_KV"
id = "1cd9fe319ed34d308e376376791e282f"

# Workers Logs 활성화 — cron(scheduled) 실행 로그를 사후에도 조회할 수 있게 해서 "오늘 아침 cron이
# 돌았는지/신규 몇 건이었는지"를 확인 가능하게 한다. (console.log/error가 대시보드 Logs에 남음)
[observability]
enabled = true

# 매일 08:00 KST(= 23:00 UTC): 나라장터 조회 → KV 갱신 → 신규 입찰 시 카카오 알림.
[triggers]
crons = ["0 23 * * *"]

# 과거 낙찰 이력 CSV를 Worker 번들에 문자열로 내장(analysis.loadHistoryFromText).
[[rules]]
type = "Text"
globs = ["**/*.csv"]
fallthrough = true
